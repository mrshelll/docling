# Vigila las versiones del original y las lleva a una solicitud de cambio.
# Ver docs/superpowers/specs/2026-10-08-sincronizacion-upstream-design.md (en ~/Markitdown).
#
# Ningún paso que ejecute código del original o de Claude tiene a mano un token
# con escritura: el de la cuenta de servicio se pide justo antes de publicar.
name: dotech-vigia

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Versión o commit del original (vacío = última versión publicada)"
        required: false
        default: ""
      simular:
        description: "Simular: rama dotech/sync-prueba y sin solicitud"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dotech-vigia
  cancel-in-progress: false

env:
  UPSTREAM: docling-project/docling
  RAMA: dotech/sync-upstream
  # En `schedule` el contexto `inputs` está vacío: simular queda en false.
  SIMULAR: ${{ inputs.simular == true }}

jobs:
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      accion: ${{ steps.decision.outputs.accion }}
      tag: ${{ steps.decision.outputs.tag }}
      base: ${{ steps.decision.outputs.base }}
      tag_anterior: ${{ steps.decision.outputs.tag_anterior }}
      rama_huerfana: ${{ steps.decision.outputs.rama_huerfana }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DOTECH_APP_ID }}
          private-key: ${{ secrets.DOTECH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apagar automatismos heredados
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/dotech/workflows_heredados.py --repo "$GITHUB_REPOSITORY"
      - name: Traer el original
        run: |
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet --tags upstream
          git fetch --quiet origin "$RAMA" 2>/dev/null || true
      - id: decision
        name: Decidir
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REF_MANUAL: ${{ inputs.ref }}
        run: python3 scripts/dotech/version.py --repo "$GITHUB_REPOSITORY" --upstream "$UPSTREAM" --rama "$RAMA" --ref "$REF_MANUAL" >> "$GITHUB_OUTPUT"

  preparar:
    needs: decidir
    if: needs.decidir.outputs.accion == 'sincronizar'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.rama.outputs.sha }}
      destino: ${{ steps.rama.outputs.destino }}
      conflicto: ${{ steps.merge.outputs.conflicto }}
      resumen_conflicto: ${{ steps.claude.outputs.structured_output }}
    steps:
      # Solo para conocer el nombre de la cuenta de servicio; se revoca en el
      # paso siguiente, antes de que corra nada del original ni Claude.
      - id: identidad
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DOTECH_APP_ID }}
          private-key: ${{ secrets.DOTECH_APP_PRIVATE_KEY }}
          skip-token-revoke: "true"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: autor
        name: Identidad de la cuenta de servicio
        env:
          GH_TOKEN: ${{ steps.identidad.outputs.token }}
          SLUG: ${{ steps.identidad.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          gh api -X DELETE /installation/token
          nombre="${SLUG}[bot]"
          correo="${id}+${SLUG}[bot]@users.noreply.github.com"
          git config user.name "$nombre"
          git config user.email "$correo"
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          echo "correo=$correo" >> "$GITHUB_OUTPUT"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet --tags upstream
          git fetch --quiet origin "$RAMA" 2>/dev/null || true
      - id: merge
        name: Mezclar la versión
        env:
          TAG: ${{ needs.decidir.outputs.tag }}
          BASE: ${{ needs.decidir.outputs.base }}
        run: |
          git switch -C trabajo "origin/$BASE"
          if git merge --no-ff --no-edit -m "chore: merge upstream $TAG" "$TAG"; then
            echo "conflicto=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            delim="FIN_$(openssl rand -hex 16)"
            echo "conflicto=true" >> "$GITHUB_OUTPUT"
            { echo "archivos<<$delim"; git diff --name-only --diff-filter=U; echo "$delim"; } >> "$GITHUB_OUTPUT"
          else
            echo "::error::git merge falló sin dejar un merge en curso: no es un conflicto."
            exit 1
          fi
      # Si el entorno no se puede montar (p. ej. uv.lock en conflicto), Claude sigue:
      # sin tests no puede dar el conflicto por resuelto y el informe lo marca.
      - name: Entorno para que Claude corra tests
        if: steps.merge.outputs.conflicto == 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-ubuntu-ci
        with:
          python_version: "3.12"
          uv_sync_args: --frozen --group dev --all-extras --all-packages --no-group docs --no-group examples
          install_system_deps: "true"
          cache_models: "true"
      # continue-on-error: si Claude falla o no devuelve el resumen, el merge sigue y
      # el informe sale como «Claude no dio por resuelto el conflicto» (estado rojo).
      - id: claude
        name: Claude resuelve el conflicto
        if: steps.merge.outputs.conflicto == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Estás en un `git merge` en curso: la versión ${{ needs.decidir.outputs.tag }} del
            proyecto original de Docling se está mezclando sobre nuestro fork. Hay conflictos en:

            ${{ steps.merge.outputs.archivos }}

            Nuestros arreglos propios están descritos en `scripts/dotech/arreglos.toml`
            (qué archivos tocan y qué test comprueba cada uno).

            Para cada archivo en conflicto:
            1. Entiende qué cambió el original (`git log -p ORIG_HEAD..MERGE_HEAD -- <archivo>`)
               y qué hacía nuestro lado (`git log -p MERGE_HEAD..ORIG_HEAD -- <archivo>`).
            2. Conserva el comportamiento de nuestro arreglo adaptado a la estructura nueva del
               original. No reviertas cambios del original. Si nuestro bloque pertenece a código
               que el original eliminó o movió, lleva nuestro cambio al sitio nuevo.
            3. Deja el archivo sin marcas de conflicto.

            Después corre los tests de comportamiento de los arreglos afectados con
            `uv run --no-sync pytest -q -p no:cacheprovider <test>`.

            No hagas commit ni push: el flujo se encarga. Responde con el resumen estructurado:
            `resuelto` = true solo si no quedan marcas y los tests de los arreglos afectados pasan.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Edit,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(uv run --no-sync pytest:*)"
            --json-schema '{"type":"object","properties":{"resuelto":{"type":"boolean"},"archivos":{"type":"array","items":{"type":"object","properties":{"archivo":{"type":"string"},"original":{"type":"string"},"decision":{"type":"string"},"tests":{"type":"string"}},"required":["archivo","original","decision","tests"]}}},"required":["resuelto","archivos"]}'
      # La acción de Claude cambia user.name/user.email a claude[bot]: el commit del
      # merge vuelve a firmarse con la cuenta de servicio.
      - name: Cerrar el merge
        if: steps.merge.outputs.conflicto == 'true'
        env:
          NOMBRE: ${{ steps.autor.outputs.nombre }}
          CORREO: ${{ steps.autor.outputs.correo }}
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . ; then
            echo "::error::Quedan marcas de conflicto: hay que resolverlo a mano."
            exit 1
          fi
          git add -u
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Quedan archivos sin resolver: hay que resolverlo a mano."
            exit 1
          fi
          git config user.name "$NOMBRE"
          git config user.email "$CORREO"
          git commit --no-edit
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DOTECH_APP_ID }}
          private-key: ${{ secrets.DOTECH_APP_PRIVATE_KEY }}
      - id: rama
        name: Publicar la rama
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HUERFANA: ${{ needs.decidir.outputs.rama_huerfana }}
        run: |
          if [ "$SIMULAR" = "true" ]; then destino=dotech/sync-prueba; else destino="$RAMA"; fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          if [ "$SIMULAR" = "true" ] || [ "$HUERFANA" = "true" ]; then
            git push --quiet origin --delete "$destino" 2>/dev/null || true
          fi
          git push --quiet origin "HEAD:refs/heads/$destino"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "destino=$destino" >> "$GITHUB_OUTPUT"

  tests-original:
    needs: [decidir, preparar]
    uses: ./.github/workflows/dotech-pruebas.yml
    with:
      lado: original
      repositorio: docling-project/docling
      ref: ${{ needs.decidir.outputs.tag }}
      sha_nuestra: ${{ needs.preparar.outputs.sha }}
      evaluar_sobra: true

  tests-nuestra:
    needs: [decidir, preparar]
    uses: ./.github/workflows/dotech-pruebas.yml
    with:
      lado: nuestra
      repositorio: ${{ github.repository }}
      ref: ${{ needs.preparar.outputs.sha }}
      sha_nuestra: ${{ needs.preparar.outputs.sha }}

  comparar:
    needs: [decidir, preparar, tests-original, tests-nuestra]
    if: always() && needs.preparar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hay_nuestras: ${{ steps.c.outputs.hay_nuestras }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preparar.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tests-*
          path: artefactos
      - id: c
        name: Atribuir fallos y listar el lote
        env:
          TAG: ${{ needs.decidir.outputs.tag }}
          TAG_ANTERIOR: ${{ needs.decidir.outputs.tag_anterior }}
          SHA: ${{ needs.preparar.outputs.sha }}
        run: |
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet --tags upstream
          # Un artefacto de otro commit (p. ej. de un intento anterior) no cuenta:
          # se descarta y la comparación lo trata como corrida sin resultado.
          descartar_si_ajeno() {
            if [ "$(cat "$1/ref.txt" 2>/dev/null)" != "$2" ]; then
              echo "::warning::$1 no corresponde a $2; se descarta."
              rm -rf "$1"
            fi
          }
          descartar_si_ajeno artefactos/tests-original "$(git rev-parse "$TAG^{commit}")"
          descartar_si_ajeno artefactos/tests-nuestra "$SHA"
          mkdir -p artefactos/tests-original artefactos/tests-nuestra
          python3 scripts/dotech/comparar_junit.py --original artefactos/tests-original \
            --nuestra artefactos/tests-nuestra --salida comparacion.json >> "$GITHUB_OUTPUT"
          python3 scripts/dotech/lote.py --registro scripts/dotech/arreglos.toml \
            --desde "$TAG_ANTERIOR" --hasta "$TAG" --salida lote.json
          cp artefactos/tests-original/sobra.json sobra.json 2>/dev/null || echo '{}' > sobra.json
      - uses: actions/upload-artifact@v4
        with:
          name: informe-datos
          path: |
            comparacion.json
            lote.json
            sobra.json
          if-no-files-found: error
          overwrite: true

  explicar:
    needs: [decidir, preparar, comparar]
    if: always() && needs.comparar.outputs.hay_nuestras == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      explicacion: ${{ steps.texto.outputs.explicacion }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preparar.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: informe-datos
      # Solo lectura: basta el token del propio flujo. Si Claude falla, la
      # solicitud sale sin explicación, no sin informe.
      - id: claude
        name: Claude explica los fallos nuestros
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Tras mezclar la versión ${{ needs.decidir.outputs.tag }} del original en nuestro fork,
            fallan tests que en el original pasan. Están en `comparacion.json` (clave `nuestras`,
            con su mensaje en `mensajes`). Los cambios del lote que tocan nuestros arreglos están
            en `lote.json`, y nuestros arreglos en `scripts/dotech/arreglos.toml`.

            Lee el test que falla y los cambios relacionados, y explica en un párrafo corto, en
            español y sin jerga, la causa probable: qué cambió el original y por qué choca con
            nuestro arreglo. No propongas código ni toques archivos.
          claude_args: >-
            --model claude-haiku-5-5
            --max-turns 5
            --allowedTools "Read,Glob,Grep,Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"explicacion":{"type":"string"}},"required":["explicacion"]}'
      - id: texto
        name: Extraer la explicación
        env:
          SALIDA: ${{ steps.claude.outputs.structured_output }}
        run: |
          explicacion=""
          if [ -n "$SALIDA" ]; then
            explicacion=$(printf '%s' "$SALIDA" | jq -r '.explicacion // empty' 2>/dev/null) || explicacion=""
          fi
          delim="FIN_$(openssl rand -hex 16)"
          { echo "explicacion<<$delim"; printf '%s\n' "$explicacion"; echo "$delim"; } >> "$GITHUB_OUTPUT"

  publicar:
    needs: [decidir, preparar, comparar, explicar]
    if: always() && needs.preparar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ needs.preparar.outputs.sha }}
      ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DOTECH_APP_ID }}
          private-key: ${{ secrets.DOTECH_APP_PRIVATE_KEY }}
      # La rama ya está publicada: si la comparación no terminó, el commit recibe un
      # estado rojo en vez de quedarse sin estado.
      - name: ¿Terminó la comparación?
        env:
          COMPARAR: ${{ needs.comparar.result }}
        run: |
          if [ "$COMPARAR" != "success" ]; then
            echo "::error::La comparación terminó en «$COMPARAR»: no hay informe."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preparar.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: informe-datos
      - id: informe
        name: Escribir el informe
        env:
          CONFLICTO: ${{ needs.preparar.outputs.conflicto }}
          RESUMEN_CONFLICTO: ${{ needs.preparar.outputs.resumen_conflicto }}
          EXPLICACION: ${{ needs.explicar.outputs.explicacion }}
          TAG: ${{ needs.decidir.outputs.tag }}
          TAG_ANTERIOR: ${{ needs.decidir.outputs.tag_anterior }}
        run: |
          python3 scripts/dotech/informe.py --registro scripts/dotech/arreglos.toml \
            --tag "$TAG" --tag-anterior "$TAG_ANTERIOR" --comparacion comparacion.json \
            --sobra sobra.json --lote lote.json --enlace "$ENLACE" \
            --salida-cuerpo cuerpo.md >> "$GITHUB_OUTPUT"
          cat cuerpo.md >> "$GITHUB_STEP_SUMMARY"
      - name: Abrir o actualizar la solicitud
        if: env.SIMULAR != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TITULO: ${{ steps.informe.outputs.titulo }}
        run: |
          numero=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$RAMA" --base main --state open \
            --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          if [ -z "$numero" ]; then
            gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$RAMA" \
              --title "$TITULO" --body-file cuerpo.md --reviewer mrshelll,alejojau
          else
            gh pr edit "$numero" -R "$GITHUB_REPOSITORY" --title "$TITULO" --body-file cuerpo.md
          fi
      - name: Estados del commit
        if: env.SIMULAR != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ESTADO: ${{ steps.informe.outputs.estado }}
          DESCRIPCION: ${{ steps.informe.outputs.descripcion }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$ESTADO" \
            -f context=dotech/tests -f description="$DESCRIPCION" -f target_url="$ENLACE"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
            -f context=dotech/validacion-local -f description="Falta docling-validar en el Mac de Miguel"
      - name: Marcar el fallo en el commit
        if: failure() && env.SIMULAR != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=failure \
            -f context=dotech/tests -f description="La sincronización falló antes de publicar el informe" \
            -f target_url="$ENLACE"
      - name: Limpiar la simulación
        if: always() && env.SIMULAR == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/dotech/sync-prueba"
