# Arreglos propios del fork. Lo lee la sincronización automática para saber qué
# probar sobre cada versión del original. `test_comportamiento` solo puede usar la
# API del original: si importara un módulo nuestro, fallaría sobre el original por
# importación y no por comportamiento.

[[arreglo]]
clave = "bug2"
nombre = "Bug 2 — etiqueta y valor separados en formularios"
en_main = true
archivos = [
  "docling/utils/layout_postprocessor.py",
  "docling/models/stages/reading_order/readingorder_model.py",
]
test_comportamiento = "tests/test_layout_key_value_reading_order.py"

[[arreglo]]
clave = "bug45"
